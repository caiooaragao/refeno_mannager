services:
  mysql:
    image: mysql:8
    container_name: refeno_mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: refeno_manager
      MYSQL_USER: refeno
      MYSQL_PASSWORD: refeno
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: refeno_api
    restart: unless-stopped
    ports:
      - "3333:3333"
    environment:
      DATABASE_URL: mysql://refeno:refeno@mysql:3306/refeno_manager
      API_PORT: 3333
      SEED_ADMIN_LOGIN: dantenovaes
      SEED_ADMIN_PASSWORD: danterefeno
    depends_on:
      mysql:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    container_name: refeno_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  mysql_data:
